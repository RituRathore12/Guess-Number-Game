<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <div class="no w-100 w-md-75 w-lg-50 mx-auto mt-5 p-3 p-md-5">
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12">
 <h1 class="text-center text-success mb-5">Guess The Number</h1>
     <div class="d-flex justify-content-center align-items-center g-5">
    <input type="Number" placeholder="Enter the Number" id="guess" class="form-control w-50 text-center">
    <button class="btn btn-success border border-light ms-2" id="btn"> ok</button>
     </div>
     <p id="result" class="text-center text-light mt-4"></p>
            </div>
        </div>
       
    </div>
    <script>
        let num = Math.floor(Math.random()*100)+1;
        console.log(num);

        let g = document.getElementById("guess");
         let btn = document.getElementById("btn");
         let res = document.getElementById("result");

btn.addEventListener("click",function(){
  let UserNum = (Number(g.value));


if (UserNum > num) {
    res.innerText = "guess is greater than the secret number";
} else if (UserNum < num){
    res.innerText = "guess is less than the secret number";
}else if (UserNum === num){
     res.innerText = "Winner 🎉";
}else{
    res.innerText = "Error";
}
})

    </script>
        
</body>
</html>
